<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CoreMedia Responsive Image Comparison</title>
    <h2>CoreMedia Responsive Image Comparison</h2>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #fafafa;
        padding: 50px;
        text-align: center;
      }
      select {
        font-size: 16px;
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 30px;
      }
      .comparison-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px;
        margin-bottom: 50px;
      }
      .img-container {
        flex: 1 1 45%;
        text-align: center;
      }
      .img-container img {
        width: auto;
        height: auto;
        max-width: 100%;
        border: 1px solid #ccc;
        border-radius: 6px;
        display: block;
        margin: 0 auto;
        object-fit: cover;
        image-rendering: crisp-edges;
      }
      table {
        border-collapse: collapse;
        margin: 30px auto;
        width: 95%;
      }
      table,
      th,
      td {
        border: 1px solid #999;
      }
      th,
      td {
        padding: 8px;
        text-align: center;
      }
      h2 {
        margin-top: 50px;
        color: #444;
      }
      h3 {
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>OSX Default Compression + Blur(Gaussian Filter)</h1>
    <p>Select a ratio below to view all related comparisons:</p>

    <select id="ratioSelect" onchange="showRatio()">
      <option value="ratio1x1">1:1 (Portrait)</option>
      <option value="ratio4x3">4:3 (Standard)</option>
      <option value="ratio8x3">8:3 (Wide)</option>
      <option value="ratio16x9">16:9 (Landscape)</option>
    </select>

    <div id="content"></div>

    <script>
      const tests = {
        ratio1x1: {
          title: "Responsive Image Comparison – 1:1 Ratio",
          aspect: "1 / 1",
          delivered: "555x555",
          deliveredBig: "1110x1110",
          urlHQ:
            "https://preview.cm23.coremedia.training/resource/image/13830/portrait_ratio1x1/555/555/45ee0a388c4e073937b2f928e0d26644/96388A654153DEB8C363BF216BEA30EE/",
          urlFuzzy:
            "https://preview.cm23.coremedia.training/resource/image/18494/portrait_ratio1x1/555/555/2979132f1ccfedb0ec16b990193ca43e/BA2894F18A5EE79FAC83532D579FB980/img-compression-blur.jpg",
          urlHQBig:
            "https://preview.cm23.coremedia.training/resource/image/13830/portrait_ratio1x1/1110/1110/556892a2d35e0401ac9cdcd32a7b0c91/70ED4402E2774D920BF7F19C4056BD5A/img2-originalimage.jpg",
          urlFuzzyBig:
            "https://preview.cm23.coremedia.training/resource/image/18494/portrait_ratio1x1/1110/1110/bd4b0f949885ccfe8aa5f9f88fbdebd9/18E4024B7BE02390CB7116F91A21B74B/img-compression-blur.jpg",
          metrics: {
            HQ: { size: 70.1, time: 323 },
            Fuzzy: { size: 53.9, time: 169 },
            BigHQ: { size: 257, time: 338 },
            BigFuzzy: { size: 151, time: 322 },
          },
        },
        ratio4x3: {
          title: "Responsive Image Comparison – 4:3 Ratio",
          aspect: "4 / 3",
          delivered: "1200x905",
          deliveredBig: "2400x1810",
          urlHQ:
            "https://preview.cm23.coremedia.training/resource/image/13830/landscape_ratio4x3/1200/905/7babfad3e42bc66382514636b6a1b4d8/0372C14D05B620841E8AF33B14F08ACE/",
          urlFuzzy:
            "https://preview.cm23.coremedia.training/resource/image/18494/landscape_ratio4x3/1200/905/751da6801de3a9ddb103c93ef6925d8e/C4AF22DB4600B4EA8BF7BDA4FD938343/img-compression-blur.jpg",
          urlHQBig:
            "https://preview.cm23.coremedia.training/resource/image/13830/landscape_ratio4x3/2400/1810/f4773950e8e7f8edc7a3fa46a8b1c754/E297C90306A4298031550F5A13425C71/img2-originalimage.jpg",
          urlFuzzyBig:
            "https://preview.cm23.coremedia.training/resource/image/18494/landscape_ratio4x3/2400/1810/ce75a6dc063631bd2f3b4d5a68c87d7e/7FC1B9BBE46D722E5707B36735A4C542/img-compression-blur.jpg",
          metrics: {
            HQ: { size: 243, time: 313 },
            Fuzzy: { size: 145, time: 387 },
            BigHQ: { size: 662, time: 331 },
            BigFuzzy: { size: 365, time: 387 },
          },
        },
        ratio8x3: {
          title: "Responsive Image Comparison – 8:3 Ratio",
          aspect: "8 / 3",
          delivered: "1144x429",
          deliveredBig: "2288x858",
          urlHQ:
            "https://preview.cm23.coremedia.training/resource/image/13830/landscape_ratio8x3/1144/429/b2a242af606b9e38ad2970a4ae03c011/FA454C0204C0AE82F11E6589AAC5145E/",
          urlFuzzy:
            "https://preview.cm23.coremedia.training/resource/image/18494/landscape_ratio8x3/1144/429/bcd2e8d8c94eb478f3d73c4f616d2686/E3AA97B8458855FE97C56EA783D850FF/img-compression-blur.jpg",
          urlHQBig:
            "https://preview.cm23.coremedia.training/resource/image/13830/landscape_ratio8x3/2280/858/989e9d58ce5b997627d6a2f104b359e9/E829FBB9B9258C878B624B855FA74FB2/img2-originalimage.jpg",
          urlFuzzyBig:
            "https://preview.cm23.coremedia.training/resource/image/18494/landscape_ratio8x3/2280/858/e112915b03fad0d6b1ffe2076b53ee85/121457BC9A04AE8457381FBCF4A751C2/img-compression-blur.jpg",
          metrics: {
            HQ: { size: 106, time: 347 },
            Fuzzy: { size: 81.9, time: 354 },
            BigHQ: { size: 399, time: 280 },
            BigFuzzy: { size: 235, time: 348 },
          },
        },
        ratio16x9: {
          title: "Responsive Image Comparison – 16:9 Ratio",
          aspect: "16 / 9",
          delivered: "1200x675",
          deliveredBig: "2400x1350",
          urlHQ:
            "https://preview.cm23.coremedia.training/resource/image/13830/landscape_ratio16x9/1200/675/35526ba9c879ffbd5b845bbf48e8481/3CE5F6DDB2D7257304658A0619F68186/",
          urlFuzzy:
            "https://preview.cm23.coremedia.training/resource/image/18494/landscape_ratio16x9/1200/675/35b720e82b3db2ecbd3bfb10bf18dc41/1DBA87A125BD0EC982525838B865A4D9/img-compression-blur.jpg",
          urlHQBig:
            "https://preview.cm23.coremedia.training/resource/image/13830/landscape_ratio16x9/2400/1350/4d4698af6c3c15ac261d8c73b029e72b/46976A7AF291DC3F5E8B815C02171F66/img2-originalimage.jpg",
          urlFuzzyBig:
            "https://preview.cm23.coremedia.training/resource/image/18494/landscape_ratio16x9/2400/1350/a30ad62161e2bf367e93b4348b3de19a/F91ABC196F72D4A291924DF443E181D6/img-compression-blur.jpg",
          metrics: {
            HQ: { size: 164, time: 232 },
            Fuzzy: { size: 118, time: 351 },
            BigHQ: { size: 556, time: 410 },
            BigFuzzy: { size: 315, time: 410 },
          },
        },
      };

      function showRatio(forceVal = null) {
        const val =
          forceVal ||
          document.getElementById("ratioSelect").value ||
          "ratio1x1";
        document.getElementById("ratioSelect").value = val;

        const t = tests[val];
        const content = document.getElementById("content");

        const [w, h] = t.delivered.split("x").map(Number);

        content.innerHTML = `
      <style>
        img { aspect-ratio: ${t.aspect}; }
      </style>

      <h3>Results Summary</h3>
      <h3 style="color:red;">Rendered column now fixed to delivered pixel dimensions (${t.delivered})</h3>

      <table id="resultsTable">
        <tr>
          <th>Version</th><th>Type</th><th>Delivered</th><th>Rendered</th>
          <th>File Size (KB)</th><th>Load Time (ms)</th><th>Notes</th>
        </tr>
        <tr id="rowHQ"><td>High Quality</td><td>CAE  Scaling</td>
          <td>${t.delivered}</td><td class="renderHQ">-</td>
          <td>${t.metrics.HQ.size}</td><td>${t.metrics.HQ.time}</td><td>-</td></tr>
        <tr id="rowHQBig"><td>High Quality</td><td>Browser Downscale</td>
          <td>${t.deliveredBig} → ${t.delivered}</td><td class="renderHQBig">-</td>
          <td>${t.metrics.BigHQ.size}</td><td>${t.metrics.BigHQ.time}</td><td>-</td></tr>
        <tr id="rowFuzzy"><td>OSX_Compression(MAX)</td><td>CAE  Scaling</td>
          <td>${t.delivered}</td><td class="renderFuzzy">-</td>
          <td>${t.metrics.Fuzzy.size}</td><td>${t.metrics.Fuzzy.time}</td><td>-</td></tr>
        <tr id="rowFuzzyBig"><td>OSX_Compression(MAX)</td><td>Browser Downscale</td>
          <td>${t.deliveredBig} → ${t.delivered}</td><td class="renderFuzzyBig">-</td>
          <td>${t.metrics.BigFuzzy.size}</td><td>${t.metrics.BigFuzzy.time}</td><td>-</td></tr>
      </table>
      <h2>${t.title}</h2>

      <div class="comparison-row">
        <div class="img-container">
          <h3>CAE  Scaling (High Quality)</h3>
          <img id="hq" src="${t.urlHQ}img2-originalimage.jpg">
        </div>
        <div class="img-container">
          <h3>Browser Downscale (High Quality) => Double Size</h3>
          <img id="hqBig" src="${t.urlHQBig}">
        </div>
      </div>

      <div class="comparison-row">
        <div class="img-container">
          <h3>CAE  Scaling (OSX_Preview / Compressed)</h3>
          <img id="fuzzy" src="${t.urlFuzzy}">
        </div>
        <div class="img-container">
          <h3>Browser Downscale (OSX_Preview / Compressed) => Double Size</h3>
          <img id="fuzzyBig" src="${t.urlFuzzyBig}">
        </div>
      </div>
    `;

        // Set fixed max-widths dynamically
        document.querySelectorAll(".img-container img").forEach((img) => {
          img.style.maxWidth = `${w}px`;
        });

        updateRenderedSizes();
        window.addEventListener("resize", updateRenderedSizes);
      }

      function updateRenderedSizes() {
        const imgs = {
          renderHQ: document.getElementById("hq"),
          renderHQBig: document.getElementById("hqBig"),
          renderFuzzy: document.getElementById("fuzzy"),
          renderFuzzyBig: document.getElementById("fuzzyBig"),
        };

        for (const key in imgs) {
          const img = imgs[key];
          if (img && img.complete) {
            const cell = document.querySelector(`.${key}`);
            if (cell) {
              cell.textContent = `${img.clientWidth}×${img.clientHeight}`;
            }
          }
        }
      }

      window.onload = () => showRatio("ratio1x1");
    </script>
  </body>
</html>
